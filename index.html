<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Coal Quality Predictor</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="container">

    <!-- ================================= -->
    <!-- HEADER -->
    <!-- ================================= -->

    <header class="header">

        <div class="header-left">

            <h1>⛏️ Coal Quality Predictor</h1>

            <p>
                Machine Learning Based Coal Quality Prediction
            </p>

        </div>

        <div class="header-right">

            <div class="version-card">

                <span>Deployment Model</span>

                <strong>Random Forest Regression</strong>

                <small>Version 2.0</small>

            </div>

        </div>

    </header>

    <!-- ================================= -->
    <!-- MAIN -->
    <!-- ================================= -->

    <main class="main-layout">

        <!-- LEFT PANEL -->

        <aside class="sidebar">

            <h2>Input Parameters</h2>

            <label>Pit Location</label>

            <select id="pit">
                <option>Tutupan</option>
                <option>Wara</option>
                <option>Paringin</option>
            </select>

            <label>Coal Seam</label>

            <select id="seam">

                <option>T117</option>
                <option>T120</option>
                <option>T121</option>
                <option>T112</option>
                <option>C1</option>
                <option>C2</option>
                <option>C3</option>

            </select>

            <label>North Coordinate</label>

            <input
                id="north"
                type="number"
                value="20219.50">

            <label>East Coordinate</label>

            <input
                id="east"
                type="number"
                value="3903.00">

            <label>Elevation (RL)</label>

            <input
                id="rl"
                type="number"
                value="56">

            <div class="button-group">

                <button class="predict-btn">

                    🔮 Predict

                </button>

                <button class="reset-btn">

                    Reset

                </button>

            </div>

        </aside>

        <!-- RIGHT PANEL -->

        <section class="content">
